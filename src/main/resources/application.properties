# Nome da aplicação
spring.application.name=login-seguro

# Conexão com o MongoDB Atlas.
# O valor real vem da variável de ambiente MONGODB_URI (nunca versionar a senha).
spring.mongodb.uri=${MONGODB_URI}

# Cria automaticamente os índices definidos nas classes (ex.: e-mail único)
spring.data.mongodb.auto-index-creation=true


# Tema visual ativo (nome da pasta em src/main/resources/static/themes/)
app.tema=padrao


# Administrador inicial (valores vêm de variáveis de ambiente; opcional).
# Se o e-mail já existir, a conta é promovida a ADMIN.
# Se não existir, é criada com a senha informada.
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_SENHA:}