<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
  Fragmentos reutilizados por todas as páginas.
  Alterar algo aqui (ex.: o menu) muda o sistema inteiro.
-->

<!-- ===== <head>: carrega o CSS do tema ativo ===== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Login Seguro'">Login Seguro</title>
    <link rel="stylesheet" th:href="@{/themes/{t}/style.css(t=${tema})}">
</head>

<body>

<!-- ===== Cabeçalho com menu: os links mudam conforme o perfil ===== -->
<header th:fragment="navbar" class="navbar">
    <a th:href="@{/}" class="logo">Login Seguro</a>
    <nav>
        <!-- Visitante (não logado) -->
        <th:block sec:authorize="isAnonymous()">
            <a th:href="@{/login}">Entrar</a>
            <a th:href="@{/cadastro}" class="btn">Criar conta</a>
        </th:block>

        <!-- Usuário logado -->
        <th:block sec:authorize="isAuthenticated()">
            <a th:href="@{/painel}">Painel</a>
            <a sec:authorize="hasAnyRole('ADMIN','GESTOR')" th:href="@{/gestor}">Gestão</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/usuarios}">Usuários</a>
            <!-- Logout precisa ser POST (com token CSRF, incluído automaticamente) -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-link">Sair</button>
            </form>
        </th:block>
    </nav>
</header>

<!-- ===== Rodapé ===== -->
<footer th:fragment="footer" class="footer">
    Login Seguro &middot; Spring Boot + Thymeleaf + MongoDB Atlas
</footer>

</body>
</html>
